name: incident_reporter
description: Citizen incident-reporting Flutter app. Talks to FastAPI only (dio). No supabase-flutter.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  dio: ^5.4.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  flutter_secure_storage: ^9.2.2
  firebase_core: ^2.27.0
  firebase_messaging: ^14.8.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
