[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname  # overridden by env.py (SUPABASE_DB_URL_DIRECT)

[loggers]
keys = root

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
