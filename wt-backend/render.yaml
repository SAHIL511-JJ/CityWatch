services:
  - type: web
    name: incident-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL_POOLER
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: FCM_CRED_JSON
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: incident-photos
  - type: worker
    name: incident-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery worker --loglevel=info --concurrency=2
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL_POOLER
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_API_KEY
        sync: false
